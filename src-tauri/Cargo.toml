[package]
name = "diff-anywhere"
version = "0.1.0"
description = "Visual diff for local and remote (SSH) files and folders"
edition = "2021"
license = "MIT"

[lib]
name = "diff_anywhere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
walkdir = "2"
md-5 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
